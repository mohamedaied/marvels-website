                  - { label: "تيل", value: teal }
                  - { label: "أزرق", value: blue }
                  - { label: "دهبي", value: gold }

      # ---------------- الأسعار
      - name: pricing
        label: "الباقات والأسعار"
        file: content/pricing.json
        format: json
        fields:
          - label: "باقات الريلز الشهرية"
            name: plans
            widget: list
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { label: "اسم الباقة", name: name, widget: string }
              - { label: "السعر الشهري (جنيه)", name: price, widget: number, value_type: int, min: 0 }
              - { label: "باقة مميزة (لونها كحلي)", name: featured, widget: boolean, default: false, required: false }
              - { label: "شارة فوق الباقة (عربي)", name: tag_ar, widget: string, required: false }
              - { label: "شارة فوق الباقة (English)", name: tag_en, widget: string, required: false }
              - label: "بتشمل (عربي)"
                name: features_ar
                widget: list
                field: { label: "نقطة", name: item, widget: string }
              - label: "بتشمل (English)"
                name: features_en
                widget: list
                required: false
                field: { label: "Point", name: item, widget: string }
          - label: "أسعار البودكاست"
            name: podcast
            widget: list
            summary: "{{fields.name_ar}} — {{fields.price}}"
            fields:
              - { label: "الخدمة (عربي)", name: name_ar, widget: string }
              - { label: "الخدمة (English)", name: name_en, widget: string, required: false }
              - { label: "بتشمل (عربي)", name: desc_ar, widget: string }
              - { label: "بتشمل (English)", name: desc_en, widget: string, required: false }
              - { label: "السعر (جنيه)", name: price, widget: number, value_type: int, min: 0 }
              - { label: "الوحدة (عربي)", name: unit_ar, widget: string, hint: "مثلًا: جنيه / حلقة" }
              - { label: "الوحدة (English)", name: unit_en, widget: string, required: false }
          - { label: "سعر ساعة إيجار الاستوديو (جنيه)", name: studio_rate, widget: number, value_type: int, min: 0 }
          - { label: "سعر الـ4 ريلز التجريبية (جنيه)", name: trial_price, widget: number, value_type: int, min: 0 }
          - { label: "نسبة خصم المؤسسين %", name: founders_discount, widget: number, value_type: int, min: 0, max: 100 }

